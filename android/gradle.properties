org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
android.ndkVersion=28.2.13676358

# Gradle 镜像配置（阿里云）
systemProp.gradle.wrapperUrl=https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.11.1-bin.zip

# 配置 Gradle 代理以使用阿里云镜像
systemProp.maven.aliyun.enabled=true
org.gradle.vfs.watch=false

org.gradle.java.home=D:/AndroidStudio/jbr

# 禁用 Kotlin 增量编译，解决跨盘符缓存崩溃问题
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false

# 关闭 Gradle daemon（可能会减少缓存问题）
org.gradle.daemon=false

systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
